# Statically linking LLVM with MSVC link.exe is unreliable: the sheer number
# of objects in the LLVM archives either trips link.exe's 65535-object limit
# (LNK1189) or, when it barely fits, produces a subtly broken binary whose
# LLVM paths crash (e.g. a NULL dereference in LLVMCreateTargetMachine). Link
# with rust-lld (lld-link) instead, which has no such limit and handles the
# archives correctly.
#
# Do NOT add /NODEFAULTLIB:libcmt here: the official clang+llvm Windows
# archives are built with /MT, so dropping libcmt resolves the /MT objects'
# CRT symbols into the /MD UCRT and yields a NULL-deref crash inside LLVM at
# runtime. rust-lld tolerates the resulting duplicate-CRT link, and the binary
# runs correctly with both CRTs present.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
