[package]
name = "ntsc-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runtime support library for NTSC-compiled binaries"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
sha2 = "0.10"
base64 = "0.22"
regex = "1.11"
# TLS for `https://` in the `http` module. rustls is pure Rust (no system
# OpenSSL dependency) and webpki-roots bundles Mozilla's CA bundle, so a
# compiled binary stays self-contained. The `ring` provider is used instead
# of the default `aws-lc-rs` because it needs no C toolchain or cmake.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
tar = "0.4"
flate2 = "1.1"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
crc32fast = "1.4"
libc = "0.2"
md5 = "0.7"
hmac = "0.12"

[dev-dependencies]
# Generates a self-signed certificate for the offline TLS round-trip test.
rcgen = "0.14"
